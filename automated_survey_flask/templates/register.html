{% extends "base.html" %}
{% block title %}Register Therapist - eMolter{% endblock %}

{% block content %}
<h1>Register New Therapist</h1>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    <div class="form-group">
        <label for="nickname">Nickname *</label>
        <input type="text" class="form-control" id="nickname" name="nickname" required>
    </div>

    <div class="form-group">
        <label for="phone">Phone Number *</label>
        <input type="text" class="form-control" id="phone" name="phone"
               placeholder="+972501234567" required>
    </div>

    <div class="form-group">
        <label for="password">Password *</label>
        <input type="password" class="form-control" id="password" name="password" required>
    </div>

    <div class="form-group">
        <label for="batch">Batch</label>
        <input type="text" class="form-control" id="batch" name="batch">
    </div>

    <div class="form-group">
        <label for="language">Language</label>
        <select class="form-control" id="language" name="language">
            <option value="he-IL">Hebrew (he-IL)</option>
            <option value="de-DE">German (de-DE)</option>
            <option value="en-US">English (en-US)</option>
        </select>
    </div>

    <div class="checkbox">
        <label>
            <input type="checkbox" name="is_superuser">
            Superuser
        </label>
    </div>

    <button type="submit" class="btn btn-primary">Register Therapist</button>
    <a href="{{ url_for('therapist_list') }}" class="btn btn-default">Cancel</a>
</form>
{% endblock %}
